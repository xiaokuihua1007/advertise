spring:
  main:
    banner-mode: off
  profiles:
    active: dev
  data:
    mongodb:
      host: localhost
      port: 27017
      database: advertise
  datasource:
    url: jdbc:mysql://localhost:3306/advertise?serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true